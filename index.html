
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الدفتر اليومي الذكي | Smart Record</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #2563eb;
        --bg-slate: #0f172a;
      }
      body {
        font-family: 'Cairo', sans-serif;
        background: var(--bg-slate);
        color: #f8fafc;
        overflow-x: hidden;
        margin: 0;
      }
      
      /* Mesh Gradient Background */
      .mesh-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-color: #0f172a;
        background-image: 
          radial-gradient(at 0% 0%, hsla(222,47%,11%,1) 0, transparent 50%), 
          radial-gradient(at 50% 0%, hsla(217,91%,60%,0.15) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(164,86%,41%,0.1) 0, transparent 50%),
          radial-gradient(at 0% 100%, hsla(222,47%,11%,1) 0, transparent 50%), 
          radial-gradient(at 100% 100%, hsla(217,91%,60%,0.1) 0, transparent 50%);
      }

      .glass-effect {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* Animations for Icons */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
      
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.2);
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom": "https://esm.sh/react-dom@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "framer-motion": "https://esm.sh/framer-motion@^11.0.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.400.0",
        "react/": "https://esm.sh/react@^19.2.4/"
      }
    }
    </script>
  </head>
  <body>
    <div class="mesh-bg"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
